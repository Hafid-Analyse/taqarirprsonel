<link rel="alternate icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>تقاريري</title>
<script>
/* تطبيق الثيم قبل رسم الصفحة لتجنّب الوميض */
(function(){try{var t=JSON.parse(localStorage.getItem('tq_theme')||'{}');var m=t.mode||'auto';
var d=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.bg=d?(t.dark||'indigo'):(t.light||'lavender');}catch(e){}})();
</script>
<style>
/* ===== الخط (محلي، يعمل دون إنترنت) ===== */
@font-face{font-family:Tajawal;font-weight:400;font-display:swap;src:url(fonts/tajawal-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Tajawal;font-weight:500;font-display:swap;src:url(fonts/tajawal-arabic-500-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}

@font-face{font-family:Tajawal;font-weight:400;font-display:swap;src:url(fonts/tajawal-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF}
@font-face{font-family:Tajawal;font-weight:500;font-display:swap;src:url(fonts/tajawal-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF}
@font-face{font-family:Tajawal;font-weight:700;font-display:swap;src:url(fonts/tajawal-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF}
@font-face{font-family:Tajawal;font-weight:800;font-display:swap;src:url(fonts/tajawal-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF}

/* ===== الثيمات (الخلفيات) ===== */
:root,[data-bg=lavender]{--bg:#E6E7F2;--bg-a:#EFF0F9;--bg-b:#D8DAEC;--card:#F1F2FA;--card2:#FFFFFF;--ink:#26284A;--mut:#7D80A3;--line:rgba(110,114,170,.18);--soft:rgba(110,114,170,.09);
  --sh:9px 9px 22px rgba(148,152,200,.40),-7px -7px 18px rgba(255,255,255,.92);--sh-sm:4px 4px 10px rgba(148,152,200,.34),-3px -3px 8px rgba(255,255,255,.9);--sh-in:inset 3px 3px 7px rgba(148,152,200,.36),inset -3px -3px 7px rgba(255,255,255,.95);
  --hero1:#33366A;--hero2:#1C1D3A;--acc:#6C6FF5;--acc2:#9B7CF7;color-scheme:light}
[data-bg=paper]{--bg:#EEE8DC;--bg-a:#F5F0E6;--bg-b:#E3DACB;--card:#F4EFE5;--card2:#FFFDF8;--ink:#3A3226;--mut:#8A7E6B;--line:rgba(140,120,90,.2);--soft:rgba(140,120,90,.09);
  --sh:9px 9px 22px rgba(190,172,145,.45),-7px -7px 18px rgba(255,253,246,.95);--sh-sm:4px 4px 10px rgba(190,172,145,.4),-3px -3px 8px rgba(255,253,246,.9);--sh-in:inset 3px 3px 7px rgba(190,172,145,.4),inset -3px -3px 7px rgba(255,253,246,.95);
  --hero1:#54473A;--hero2:#2E271F;--acc:#C07A3C;--acc2:#DDA35C;color-scheme:light}
[data-bg=mint]{--bg:#E1ECE7;--bg-a:#EAF3EF;--bg-b:#D3E3DB;--card:#ECF4F0;--card2:#FBFEFC;--ink:#21362E;--mut:#6D887C;--line:rgba(80,130,110,.18);--soft:rgba(80,130,110,.09);
  --sh:9px 9px 22px rgba(145,178,163,.45),-7px -7px 18px rgba(255,255,255,.92);--sh-sm:4px 4px 10px rgba(145,178,163,.4),-3px -3px 8px rgba(255,255,255,.9);--sh-in:inset 3px 3px 7px rgba(145,178,163,.4),inset -3px -3px 7px rgba(255,255,255,.95);
  --hero1:#2A5446;--hero2:#16302A;--acc:#2FA37A;--acc2:#5BC2A0;color-scheme:light}
[data-bg=sky]{--bg:#E2E8F2;--bg-a:#ECF1F8;--bg-b:#D3DDEC;--card:#EDF2F9;--card2:#FFFFFF;--ink:#22304A;--mut:#7586A3;--line:rgba(90,120,170,.18);--soft:rgba(90,120,170,.09);
  --sh:9px 9px 22px rgba(145,163,198,.42),-7px -7px 18px rgba(255,255,255,.92);--sh-sm:4px 4px 10px rgba(145,163,198,.38),-3px -3px 8px rgba(255,255,255,.9);--sh-in:inset 3px 3px 7px rgba(145,163,198,.38),inset -3px -3px 7px rgba(255,255,255,.95);
  --hero1:#2C4A7A;--hero2:#182A4A;--acc:#3E7BFA;--acc2:#6AA0FF;color-scheme:light}
[data-bg=indigo]{--bg:#17182E;--bg-a:#1E1F3C;--bg-b:#111226;--card:#1F2041;--card2:#272950;--ink:#E9EAF8;--mut:#9396BE;--line:rgba(160,165,230,.14);--soft:rgba(160,165,230,.07);
  --sh:8px 8px 20px rgba(0,0,0,.45),-5px -5px 14px rgba(120,125,210,.07);--sh-sm:4px 4px 10px rgba(0,0,0,.42),-2px -2px 6px rgba(120,125,210,.06);--sh-in:inset 3px 3px 7px rgba(0,0,0,.45),inset -2px -2px 6px rgba(120,125,210,.07);
  --hero1:#3A3D86;--hero2:#232554;--acc:#7C7FFF;--acc2:#A88BFF;color-scheme:dark}
[data-bg=charcoal]{--bg:#18191C;--bg-a:#1E1F23;--bg-b:#121315;--card:#222327;--card2:#2A2B30;--ink:#ECECEE;--mut:#9A9BA3;--line:rgba(255,255,255,.09);--soft:rgba(255,255,255,.05);
  --sh:8px 8px 20px rgba(0,0,0,.5),-5px -5px 14px rgba(255,255,255,.03);--sh-sm:4px 4px 10px rgba(0,0,0,.45),-2px -2px 6px rgba(255,255,255,.03);--sh-in:inset 3px 3px 7px rgba(0,0,0,.5),inset -2px -2px 6px rgba(255,255,255,.04);
  --hero1:#34363E;--hero2:#1F2024;--acc:#8A8DFF;--acc2:#B39BFF;color-scheme:dark}
[data-bg=ocean]{--bg:#0E1A26;--bg-a:#12212F;--bg-b:#0A141D;--card:#142434;--card2:#1A2D40;--ink:#E3EEF8;--mut:#89A2BA;--line:rgba(120,180,230,.13);--soft:rgba(120,180,230,.06);
  --sh:8px 8px 20px rgba(0,0,0,.5),-5px -5px 14px rgba(90,160,230,.05);--sh-sm:4px 4px 10px rgba(0,0,0,.45),-2px -2px 6px rgba(90,160,230,.05);--sh-in:inset 3px 3px 7px rgba(0,0,0,.5),inset -2px -2px 6px rgba(90,160,230,.06);
  --hero1:#1F4468;--hero2:#122638;--acc:#4FB3FF;--acc2:#6FD0E8;color-scheme:dark}
[data-bg=cocoa]{--bg:#1C1714;--bg-a:#231D19;--bg-b:#15110E;--card:#26201B;--card2:#2F2822;--ink:#EFE6DA;--mut:#A99B89;--line:rgba(230,190,140,.12);--soft:rgba(230,190,140,.06);
  --sh:8px 8px 20px rgba(0,0,0,.5),-5px -5px 14px rgba(230,180,120,.04);--sh-sm:4px 4px 10px rgba(0,0,0,.45),-2px -2px 6px rgba(230,180,120,.04);--sh-in:inset 3px 3px 7px rgba(0,0,0,.5),inset -2px -2px 6px rgba(230,180,120,.05);
  --hero1:#574330;--hero2:#2C2219;--acc:#E0A060;--acc2:#F0C080;color-scheme:dark}
[data-bg=oled]{--bg:#000;--bg-a:#000;--bg-b:#000;--card:#0F0F14;--card2:#17171E;--ink:#F2F2F5;--mut:#8E8EA0;--line:rgba(255,255,255,.1);--soft:rgba(255,255,255,.06);
  --sh:0 0 0 1px rgba(255,255,255,.07);--sh-sm:0 0 0 1px rgba(255,255,255,.07);--sh-in:inset 0 0 0 1px rgba(255,255,255,.08);
  --hero1:#1E1E33;--hero2:#0B0B14;--acc:#8B8EFF;--acc2:#B39BFF;color-scheme:dark}
:root{--red:#E5484D;--amber:#E8A100;--green:#22A06B;--r:22px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.5,1)}

/* ===== أساسيات ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px;background:var(--bg)}
body{background:radial-gradient(120% 60% at 100% 0%,var(--bg-a),transparent 60%),radial-gradient(90% 60% at 0% 100%,var(--bg-b),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh;transition:background-color .4s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:transform .18s var(--ease),box-shadow .2s,background .2s}
button:active{transform:scale(.95)}
a{color:inherit;text-decoration:none}
#app{max-width:1180px;margin:0 auto;min-height:100vh;padding-bottom:110px;overflow-x:clip}
.muted{color:var(--mut)}.sm{font-size:13px}
::selection{background:color-mix(in srgb,var(--acc) 30%,transparent)}

/* انتقالات الصفحات */
#app.fwd>:not(.nav):not(datalist){animation:inFwd .42s var(--ease) both}
#app.back>:not(.nav):not(datalist){animation:inBack .42s var(--ease) both}
#app.fade>:not(.nav):not(datalist){animation:inFade .4s var(--ease) both}
@keyframes inFwd{from{opacity:0;transform:translateX(-46px)}}
@keyframes inBack{from{opacity:0;transform:translateX(46px)}}
@keyframes inFade{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@keyframes popOut{to{transform:scale(.5);opacity:0}}
@keyframes floaty{0%,100%{transform:translate(0,0)}50%{transform:translate(-12px,10px)}}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* ===== الواجهة العلوية (الموجة) ===== */
.hero{position:relative;background:linear-gradient(165deg,var(--hero1),var(--hero2) 85%);color:#fff;padding:14px 18px 22px;padding-top:max(14px,env(safe-area-inset-top));border-radius:0 0 34px 34px;overflow:hidden;margin-bottom:6px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;pointer-events:none}
.hero::before{width:220px;height:220px;background:var(--acc);top:-80px;left:-60px;animation:floaty 9s ease-in-out infinite}
.hero::after{width:180px;height:180px;background:var(--acc2);bottom:-90px;right:10%;animation:floaty 11s ease-in-out infinite reverse;opacity:.4}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.1);color:#fff;backdrop-filter:blur(6px)}
.hero-ava img,.login .logo img{width:100%;height:100%;display:block}
.hero-ava{margin:0 auto;width:48px;height:48px;border-radius:15px;overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.14);box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25)}
.hero .ind{background:rgba(255,255,255,.12);color:#fff}
.hero-search{position:relative}
.hero-search input{width:100%;border:0;border-radius:16px;padding:13px 44px 13px 16px;background:rgba(255,255,255,.1);color:#fff;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.2);transition:background .2s}
.hero-search input::placeholder{color:rgba(255,255,255,.55)}
.hero-search input:focus{background:rgba(255,255,255,.17)}
.hero-search span{position:absolute;right:15px;top:50%;transform:translateY(-50%);opacity:.6}
.hc-wrap{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-14px);transition:grid-template-rows .45s var(--ease),opacity .35s,transform .45s var(--ease)}
.hc-wrap.open{grid-template-rows:1fr;opacity:1;transform:none}
.hc-inner{overflow:hidden;min-height:0}
.hbtn.on{background:rgba(255,255,255,.26);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.hero-card{margin-top:14px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:16px;box-shadow:0 14px 30px rgba(0,0,0,.25);backdrop-filter:blur(8px)}
.hc-row{display:flex;align-items:center;gap:12px}
.hc-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 45%,transparent)}
.hc-row b{font-size:22px;display:block}
.hc-row small{opacity:.7;font-size:13px}
.hc-stats{display:flex;gap:6px;margin-inline-start:auto}
.hc-stats span{font-size:12px;padding:4px 9px;border-radius:10px;background:rgba(255,255,255,.1)}
.hc-stats .late{background:rgba(229,72,77,.3)}
.hc-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.12);margin:14px 0 6px;overflow:hidden}
.hc-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--acc);transition:width 1s var(--ease)}
.hc-foot{font-size:12px;opacity:.7;text-align:left}
.wave{position:absolute;bottom:-1px;left:0;width:100%;height:34px;z-index:0}

/* شريط علوي للصفحات الأخرى */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.brand{font-weight:800;font-size:22px;flex:1}
.icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--card);box-shadow:var(--sh-sm)}
.icon.on{box-shadow:var(--sh-in);color:var(--acc)}
.ind{font-size:12px;padding:6px 11px;border-radius:20px;background:var(--soft);color:var(--mut);white-space:nowrap;cursor:pointer;transition:.25s}
.ind.ok{color:var(--green)}.ind.err{color:var(--red)}.ind.off,.ind.wait{color:#B07A00}.ind.saving,.ind.sync{color:var(--acc)}
.ind.dot{width:14px;height:14px;padding:0;border-radius:50%;flex:none;position:relative;font-size:0;background:var(--green)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}
.ind.dot.red{background:var(--red)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 22%,transparent);animation:blink 1s ease-in-out infinite}
.ind.dot.green{animation:breathe 2.6s ease-in-out infinite}
.ind.dot::after{content:"";position:absolute;inset:-10px}
@keyframes blink{50%{opacity:.25}}
@keyframes breathe{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--green) 0%,transparent),0 0 10px var(--green)}}
.ind.sync-old::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-inline-end:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.6)}}

/* بلاطات الأنواع (مثل أيقونات الصورة) */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 16px 6px;max-width:560px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink)}
.tile .sq{width:64px;height:64px;border-radius:21px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,var(--card2),var(--card));box-shadow:var(--sh);transition:box-shadow .25s,transform .25s var(--spring)}
.tile small{font-size:11px;color:var(--mut);font-weight:500;margin-top:-5px}
.tile.on .sq{box-shadow:var(--sh-in),0 0 0 2px var(--tc);transform:scale(.96)}
.tile.on{color:var(--tc)}

/* شرائح */
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:20px;background:var(--card);box-shadow:var(--sh-sm);font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:7px;font-weight:500}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.chip.on{background:var(--c,var(--acc));color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--c,var(--acc)) 40%,transparent)}
.chip.on .dot{background:#fff;box-shadow:none}

/* بطاقات التقارير */
.grp{padding:16px 20px 6px;font-size:13px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px;padding:4px 16px}
.card{background:linear-gradient(150deg,var(--card2),var(--card) 70%);border-radius:var(--r);box-shadow:var(--sh);padding:15px 16px;cursor:pointer;display:flex;gap:12px;min-width:0;animation:rise .5s var(--ease) both;animation-delay:calc(min(var(--i,0),12) * 40ms);transition:transform .25s var(--spring),box-shadow .25s;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset-inline-start:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--lc)}
.card:active{transform:scale(.975)}
@media(hover:hover){.card:hover{transform:translateY(-3px)}}
.c-ic{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;background:var(--lcl);box-shadow:var(--sh-sm)}
.c-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.card-top{display:flex;align-items:center;gap:6px;font-size:12px}
.tp{color:var(--mut);font-weight:700}
.lb{padding:2px 9px;border-radius:10px;background:var(--lcl);color:var(--lc);font-weight:700}
.card-top .pin{margin-inline-start:auto}
.card h4{margin:0;font-size:17px;font-weight:800;line-height:1.4;overflow-wrap:anywhere}
.card-meta{font-size:13px;color:var(--mut)}
.snip{margin:0;font-size:14px;color:color-mix(in srgb,var(--ink) 75%,var(--mut));line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{font-size:12px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}
.card-foot .red{color:var(--red);font-weight:700}
.empty{text-align:center;padding:50px 20px;color:var(--mut);animation:inFade .5s var(--ease)}
.empty .big{font-size:52px;display:inline-grid;place-items:center;width:96px;height:96px;border-radius:30px;background:var(--card);box-shadow:var(--sh);margin-bottom:10px}

/* شريط التنقل مع الزر الدائري */
.nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;width:min(420px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-around;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border-radius:28px;box-shadow:var(--sh);padding:8px 10px;height:66px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);position:relative;font-weight:700;gap:2px;padding:4px;border-radius:16px;transition:color .2s}
.nav a span{font-size:21px;transition:transform .3s var(--spring)}
.nav a.on{color:var(--acc)}
.nav a.on span{transform:translateY(-2px) scale(1.12)}
.nav a.on::after{content:"";position:absolute;bottom:-3px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.nav-fab{flex:none;width:64px;height:64px;margin-top:-34px;border-radius:50%;font-size:32px;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 55%,transparent),inset 0 2px 0 rgba(255,255,255,.3),0 0 0 7px var(--bg);display:grid;place-items:center;transition:transform .3s var(--spring)}
.nav-fab:active{transform:scale(.9) rotate(90deg)}
.nb{position:absolute;top:0;inset-inline-end:calc(50% - 24px);background:var(--red);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;animation:pop .4s var(--spring)}

/* ===== المحرر ===== */
.ed-bar{box-shadow:0 3px 0 -1px var(--lc)}
.ed-bar{gap:6px}.ed-bar .ind{max-width:96px;overflow:hidden;text-overflow:ellipsis}
.type-pill{white-space:nowrap;font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:var(--lcl);color:var(--lc)}
.bar-title{flex:1;min-width:0}
.editor{padding:6px 16px 60px;max-width:820px;margin:0 auto}
.ttl-box{display:block;background:linear-gradient(150deg,var(--card2),var(--card));border-radius:var(--r);box-shadow:var(--sh);padding:12px 16px 6px;margin:6px 0 14px;transition:box-shadow .25s;animation:rise .4s var(--ease) both}
.ttl-box:focus-within{box-shadow:var(--sh),0 0 0 2px color-mix(in srgb,var(--lc,var(--acc)) 55%,transparent)}
.ttl-lab{display:block;font-size:13px;font-weight:800;color:var(--lc,var(--acc))}
.ed-title{width:100%;border:0;background:none;font-size:23px;font-weight:800;padding:6px 0 8px;outline:none;color:var(--ink)}
.ed-title::placeholder{color:var(--mut);opacity:.85;font-weight:500;font-size:19px}
.labels-pick{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.meta-grid label{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:var(--sh-in)}
.meta-grid input{flex:1;border:0;outline:none;padding:12px 0;background:none;min-width:0}
.fld{background:linear-gradient(150deg,var(--card2),var(--card) 70%);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:16px;animation:rise .45s var(--ease) both}
.fld:nth-of-type(2){animation-delay:.04s}.fld:nth-of-type(3){animation-delay:.08s}.fld:nth-of-type(4){animation-delay:.12s}.fld:nth-of-type(5){animation-delay:.16s}.fld:nth-of-type(6){animation-delay:.2s}
.fld h3{margin:0 0 10px;font-size:15px;font-weight:800;color:var(--lc);display:flex;align-items:center;gap:8px}
.fld h3::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--lc);box-shadow:0 0 0 4px var(--lcl)}
.in{width:100%;border:0;background:var(--card);border-radius:14px;padding:11px 13px;outline:none;resize:none;line-height:1.6;box-shadow:var(--sh-in);transition:box-shadow .2s}
.in:focus{box-shadow:var(--sh-in),0 0 0 2px color-mix(in srgb,var(--lc,var(--acc)) 45%,transparent)}
textarea.auto{overflow:hidden;min-height:46px}
.lst{margin:0;padding:0;list-style:none;counter-reset:n}
.lst li{display:flex;align-items:flex-start;gap:6px;counter-increment:n;padding:2px 0}
.lst li.new{animation:rise .3s var(--ease)}
.dm-q{margin:2px 0 12px;color:var(--mut);font-size:14px}
.dmode-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dmode-pick button{background:linear-gradient(150deg,var(--card2),var(--card));border-radius:22px;box-shadow:var(--sh);padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:rise .45s var(--ease) both}
.dmode-pick button:nth-child(2){animation-delay:.07s}
.dm-ic{font-size:30px;width:64px;height:64px;border-radius:21px;display:grid;place-items:center;background:var(--lcl);box-shadow:var(--sh-sm)}
.dmode-pick b{font-size:16px}.dmode-pick small{color:var(--mut);font-size:12px;line-height:1.5}
.dmode-sw{position:relative;display:flex;background:var(--card);border-radius:16px;padding:5px;box-shadow:var(--sh-in);margin-bottom:14px}
.dmode-sw button{flex:1;position:relative;z-index:1;padding:9px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mut);transition:color .3s}
.dmode-sw button.on{color:var(--ink)}
.dmode-sw i{position:absolute;top:5px;bottom:5px;width:calc(50% - 5px);left:5px;border-radius:12px;background:var(--card2);box-shadow:var(--sh-sm);transition:left .35s var(--spring)}
.dmode-sw.right i{left:50%}
.dm-body{animation:inFade .35s var(--ease)}
.paper-w{position:relative;background:var(--card2);border-radius:18px;box-shadow:var(--sh-in);padding:10px 8px 18px;overflow:hidden}
.paper-w::before{content:"";position:absolute;top:0;bottom:0;right:30px;width:2px;background:color-mix(in srgb,var(--lc) 45%,transparent)}
.ruled{display:block;width:100%;min-height:52vh;border:0;outline:none;resize:none;overflow:hidden;background:transparent;color:var(--ink);font-size:17px;line-height:34px;padding:0 40px 0 8px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--line) 33px,var(--line) 34px);background-attachment:local}
.ruled::placeholder{color:var(--mut);opacity:.7}
.wc{font-size:12px;color:var(--mut);text-align:left;margin-top:6px;min-height:16px}
.chk-prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--mut)}
.cp-bar{flex:1;height:8px;border-radius:5px;background:var(--soft);box-shadow:var(--sh-in);overflow:hidden}
.cp-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--lc),color-mix(in srgb,var(--lc) 60%,#fff));transition:width .5s var(--spring)}
.lst.chk li{background:linear-gradient(150deg,var(--card2),var(--card));box-shadow:var(--sh-sm);border-radius:16px;padding:3px 8px;margin-bottom:10px;align-items:center}
.lst.chk li::before{display:none}
.lst.chk .hdl,.lst.chk .x{margin-top:0}
.cb{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--lc);position:relative;transition:background .25s,transform .3s var(--spring)}
.cb::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;transform:scale(0);transition:transform .3s var(--spring)}
.lst.chk li.done .cb{background:var(--lc)}
.lst.chk li.done .cb::after{transform:scale(1)}
.lst.chk li.done .li-in{text-decoration:line-through;text-decoration-color:var(--lc);color:var(--mut)}
.lst.chk li .li-in{transition:color .3s}
.lst.chk li.ticked{animation:pop .4s var(--spring)}
.lst li{transition:transform .22s var(--ease);position:relative;border-radius:14px}
.sorting .lst li{user-select:none}
.lst li.dragging{transition:none;z-index:5;background:var(--card2);box-shadow:0 12px 28px rgba(0,0,0,.18)}
.lst li.dropped{animation:pop .35s var(--spring)}
.hdl{flex:none;width:22px;margin-top:9px;height:28px;display:grid;place-items:center;color:var(--mut);opacity:.8;cursor:grab;touch-action:none;font-size:15px;font-weight:800;letter-spacing:-3px;user-select:none}
.hdl:active{cursor:grabbing;opacity:1;color:var(--lc)}
.lst li::before{content:counter(n);flex:none;width:26px;height:26px;margin-top:8px;border-radius:9px;background:var(--lcl);color:var(--lc);font-size:12px;font-weight:800;display:grid;place-items:center}
.li-in,.add-in{flex:1;border:0;background:none;outline:none;resize:none;padding:9px 4px;line-height:1.6;min-height:42px;overflow:hidden;border-bottom:1px dashed transparent;color:var(--ink)}
.li-in:focus{border-bottom-color:var(--line)}
.add-in::placeholder{color:var(--mut);opacity:.8}
.x{flex:none;width:30px;height:30px;margin-top:6px;border-radius:10px;color:var(--mut);font-size:18px;opacity:.6}
.x:hover{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);opacity:1}
.add-row{display:flex;align-items:flex-start;gap:6px;border-top:1px solid var(--line);margin-top:4px}
.add-row .plus{flex:none;width:26px;height:26px;margin-top:8px;border-radius:9px;border:1.5px dashed var(--lc);color:var(--lc);display:grid;place-items:center;font-weight:800}
.chips-in{display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:var(--card);border-radius:16px;padding:7px;box-shadow:var(--sh-in);min-height:50px}
.pchip{display:inline-flex;align-items:center;gap:2px;background:var(--card2);box-shadow:var(--sh-sm);border-radius:18px;padding:4px 6px 4px 13px;font-size:14px}
.pchip.pop{animation:pop .35s var(--spring)}
.pchip.out{animation:popOut .18s ease-in forwards}
.pchip button{width:22px;height:22px;border-radius:50%;color:var(--mut)}
.p-in{flex:1;min-width:140px;border:0;background:none;outline:none;padding:7px;color:var(--ink)}
.ghost{border:1.5px dashed var(--line);border-radius:14px;padding:10px 14px;color:var(--mut);font-weight:700;margin-top:10px;width:100%}
.ghost:hover{border-color:var(--lc,var(--acc));color:var(--lc,var(--acc))}
.ghost.sm{width:auto;font-size:13px;padding:7px 12px}
.dec{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);animation:rise .35s var(--ease)}
.dec-n{flex:none;width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,var(--lc),color-mix(in srgb,var(--lc) 70%,#000));color:#fff;display:grid;place-items:center;font-weight:800;margin-top:6px;box-shadow:0 4px 10px color-mix(in srgb,var(--lc) 40%,transparent)}
.dec-main{flex:1;min-width:0}
.dec-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;align-items:center}
.dec-row label{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:12px;padding:0 9px;flex:1;min-width:130px;box-shadow:var(--sh-in)}
.dec-row input{border:0;background:none;outline:none;padding:9px 0;flex:1;min-width:0}
.dec-row select{border:0;background:var(--card);border-radius:12px;padding:9px;box-shadow:var(--sh-in)}
.banner{background:color-mix(in srgb,#F5B000 13%,var(--card));border-radius:var(--r);padding:14px 16px;margin-bottom:16px;box-shadow:var(--sh);animation:rise .4s var(--ease)}
.banner b{color:color-mix(in srgb,#B07A00 80%,var(--ink))}
.banner ul{margin:8px 0;padding-inline-start:20px;font-size:14px;line-height:1.8}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:linear-gradient(145deg,var(--acc2),var(--acc));color:#fff;border-radius:14px;padding:11px 18px;font-weight:700;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 38%,transparent)}
.btn.sm{padding:8px 13px;font-size:13px}
.btn.light{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm)}
.btn:disabled{opacity:.5}

/* ===== النوافذ المنبثقة (تُسحب للأسفل لإغلاقها) ===== */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,10,25,0);display:flex;align-items:flex-end;justify-content:center;transition:background .3s}
.ov.show{background:rgba(10,10,25,.45);backdrop-filter:blur(3px)}
.sheet{background:linear-gradient(170deg,var(--card2),var(--card));width:100%;max-width:640px;max-height:92vh;overflow:auto;overscroll-behavior:contain;border-radius:30px 30px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .45s var(--spring);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.ov.show .sheet{transform:none}
.sheet.dragging{transition:none}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:30px}}
.grab{width:100%;padding:8px 0 12px;cursor:grab;touch-action:none}
.grab::before{content:"";display:block;width:46px;height:5px;border-radius:3px;background:var(--line);margin:0 auto;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.sheet h3{margin:0 0 16px;font-size:19px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type-grid button{background:var(--card);border-radius:22px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--sh);animation:rise .4s var(--ease) both}
.type-grid button:nth-child(2){animation-delay:.05s}.type-grid button:nth-child(3){animation-delay:.1s}.type-grid button:nth-child(4){animation-delay:.15s}
.type-grid span{font-size:30px;width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,var(--card));}
.type-grid b{font-size:17px}.type-grid small{color:var(--mut);font-size:12px;text-align:center}
.menu-list button{display:flex;width:100%;gap:12px;padding:15px 12px;border-radius:14px;font-weight:700;text-align:start}
.menu-list button:hover{background:var(--soft)}
.menu-list .danger{color:var(--red)}
.pv{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 14px;justify-content:center}
.pv-page{flex:none;text-align:center;font-size:12px;color:var(--mut);animation:rise .45s var(--ease) both}
.pv-page:nth-child(2){animation-delay:.08s}
.pv-box{width:222px;height:314px;overflow:hidden;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);margin-bottom:8px;position:relative;background:#fff}
.pv-box .paper{position:absolute;top:0;right:0;transform:scale(.2796);transform-origin:top right;pointer-events:none}
.share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0}
.share-grid button{background:var(--card);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:26px;box-shadow:var(--sh-sm)}
.share-grid b{font-size:15px}.share-grid small{font-size:11px;color:var(--mut)}
.share-grid button:disabled{opacity:.5}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(30px) scale(.9);background:color-mix(in srgb,var(--hero2) 92%,transparent);color:#fff;padding:11px 20px;border-radius:16px;font-size:14px;z-index:60;opacity:0;transition:.4s var(--spring);pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);backdrop-filter:blur(8px)}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ===== المتابعات ===== */
.tabs{display:flex;gap:6px;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:10px 15px;border-radius:15px;font-weight:700;color:var(--mut);font-size:14px;background:var(--card);box-shadow:var(--sh-sm)}
.tabs button.on{background:linear-gradient(145deg,var(--hero1),var(--hero2));color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.tabs b{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-inline-start:4px}
.fwrap{padding:0 16px}
.f-filters{display:flex;gap:8px;padding:0 16px 8px;align-items:center}
.f-filters select{border:0;background:var(--card);border-radius:14px;padding:9px 12px;max-width:70%;box-shadow:var(--sh-in)}
.seg{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding:2px}
.seg button{flex:1;min-width:84px;padding:10px 6px;border-radius:16px;background:var(--card);box-shadow:var(--sh-sm);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button b{font-size:19px;color:var(--c)}
.seg button.on{background:var(--c);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 40%,transparent)}
.seg button.on b{color:#fff}
.board{display:block}
.col{display:none}.col.active{display:block;animation:inFade .3s var(--ease)}
.col-h{display:none}
@media(min-width:900px){
  .seg{display:none}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
  .col{display:block;background:var(--soft);border-radius:var(--r);padding:12px;min-height:220px;box-shadow:var(--sh-in)}
  .col.dragover{outline:2px dashed var(--acc)}
  .col-h{display:flex;justify-content:space-between;font-weight:800;padding:2px 4px 12px;color:var(--c)}
}
.dcard{background:linear-gradient(150deg,var(--card2),var(--card));border-radius:18px;box-shadow:var(--sh);padding:13px 15px;margin-bottom:12px;transition:transform .25s var(--spring),opacity .2s;touch-action:pan-y;user-select:none;position:relative;overflow:hidden;animation:rise .4s var(--ease) both}
.dcard::after{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--lc)}
.dcard.moved{animation:pop .45s var(--spring)}
.d-text{font-weight:700;line-height:1.55;overflow-wrap:anywhere}
.d-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--mut);margin:7px 0}
.who{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.who.none{color:var(--red)}
.av,.who i{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:50%;color:#fff;font-style:normal;font-size:11px;font-weight:800;flex:none}
.src{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.due{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.due-bar{flex:1;height:7px;border-radius:5px;background:var(--soft);box-shadow:var(--sh-in);overflow:hidden}
.due-bar i{display:block;height:100%;border-radius:5px;animation:grow 1s var(--ease)}
@keyframes grow{from{width:0!important}}
.due.done{color:var(--green)}.due.none{color:var(--mut)}
.d-acts{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.d-acts button{width:38px;height:32px;border-radius:11px;background:var(--card);box-shadow:var(--sh-sm);font-weight:800}
.d-acts button:disabled{opacity:.25;box-shadow:none}
.st{font-size:12px;font-weight:800;padding:4px 11px;border-radius:10px}
.st-todo{background:var(--soft);color:var(--mut)}.st-doing{background:color-mix(in srgb,#2F6FEB 16%,transparent);color:#4C86F0}.st-done{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.empty-col{color:var(--mut);opacity:.7;text-align:center;padding:30px 0;font-size:14px}
.hint{text-align:center;color:var(--mut);opacity:.75;font-size:12px}
.person{background:linear-gradient(150deg,var(--card2),var(--card));border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;animation:rise .4s var(--ease) both}
.p-row{display:flex;align-items:center;gap:10px;width:100%;padding:13px 15px;text-align:start}
.p-row:active{transform:none}
.p-row .av{width:38px;height:38px;font-size:15px}
.pn{font-weight:800;flex:1}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.bd{font-size:11px;padding:3px 8px;border-radius:9px;background:var(--soft);color:var(--mut)}
.bd.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}.bd.green{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.person .plist{padding:12px 12px 2px;background:var(--soft)}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ringc{background:linear-gradient(150deg,var(--card2),var(--card));border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;gap:14px;align-items:center;animation:rise .45s var(--ease) both}
.ringc svg circle:last-of-type{animation:ringIn 1.2s var(--ease)}
@keyframes ringIn{from{stroke-dasharray:0 999}}
.ringc text{fill:var(--ink)}
.ringc svg circle:first-of-type{stroke:var(--line)}
.ringc h4{margin:0 0 6px;font-size:17px;color:var(--lc)}
.ringc p{margin:2px 0;font-size:13px;color:var(--mut)}
.period{display:flex;gap:8px;margin-bottom:14px}
.ents{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

.lbl-name{flex:1}
.cnt{font-size:12px;color:var(--mut);white-space:nowrap}
.presets{display:none;flex-wrap:wrap;gap:9px;padding:12px 0 4px;align-items:center}
.lbl-row.open .presets{display:flex;animation:inFade .3s var(--ease)}

  body.printing>*:not(#printHost){display:none!important}
  body.printing #printHost{display:block}

  #printHost .paper:last-child{page-break-after:auto;break-after:auto}
}

<body>
<div id="app"></div>
<div id="paperHost" aria-hidden="true"></div>
<div id="printHost"></div>
<div id="toast" class="toast"></div>

<script>
'use strict';
/* =========================================================
   الإعداد
   ضع رابط Apps Script هنا (أو أدخله من شاشة الدخول)
   ========================================================= */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbxrweLnwniBU2K5TU1b4X-RJZdXPH8Z4VAyC7LbKHt_yGiF7NrqgJxvimhDzCqEXx_Hzg/exec';

const LS = { state:'tq_state_v1', outbox:'tq_outbox_v1', token:'tq_token', api:'tq_api', mode:'tq_mode', lastLabel:'tq_last_label' };

const DEFAULT_LABELS = [
  { id:'tazaami',  name:'تازعمي',    color:'#F08A24' },
  { id:'istiqama', name:'الاستقامة', color:'#0F9D74' },
  { id:'icone',    name:'أيقونة',    color:'#2F6FEB' },
  { id:'home',     name:'المنزل',    color:'#A87C50' }
];
const PRESETS = ['#F08A24','#E5484D','#D6409F','#8E4EC6','#6E56CF','#2F6FEB','#0091B3','#0F9D74','#46A758','#B5A200','#A87C50','#4B5563'];

const TYPES = {
  meeting:{ name:'جلسة', icon:'🤝', color:'#2F6FEB', desc:'اجتماع، لقاء عمل، جلسة لجنة',
    titlePh:'موضوع الجلسة', entityPh:'مع من؟ (الجهة)',
    fields:[
      {k:'attendees', l:'الحضور', t:'people'},
      {k:'absent', l:'الغائبون', t:'people'},
      {k:'objectives', l:'الأهداف', t:'list', one:'هدفاً'},
      {k:'points', l:'نقاط الجلسة', t:'list', one:'نقطة'},
      {k:'decisions', l:'القرارات والمخرجات', t:'decisions'} ]},
  nadwa:{ name:'ندوة', icon:'🎤', color:'#8E4EC6', desc:'محاضرة أو ندوة حضرتها',
    titlePh:'عنوان الندوة', entityPh:'الجهة / المناسبة',
    fields:[
      {k:'speakers', l:'المحاضر / المتدخلون', t:'list', one:'اسماً'},
      {k:'organizer', l:'الجهة المنظمة', t:'text'},
      {k:'axes', l:'المحاور', t:'list', one:'محوراً'},
      {k:'ideas', l:'أهم الأفكار', t:'list', one:'فكرة'},
      {k:'quotes', l:'اقتباسات', t:'list', one:'اقتباساً'},
      {k:'questions', l:'أسئلة الجمهور', t:'list', one:'سؤالاً'},
      {k:'conclusion', l:'الخلاصة', t:'textarea'} ]},
  training:{ name:'تكوين', icon:'🎓', color:'#0F9D74', desc:'دورة، ورشة، حصة تكوينية',
    titlePh:'عنوان التكوين', entityPh:'الجهة المكوِّنة',
    fields:[
      {k:'trainer', l:'المكوّن', t:'text'},
      {k:'session', l:'اليوم / الحصة', t:'text', ph:'مثلاً: اليوم 2 من 5'},
      {k:'axes', l:'المحاور', t:'list', one:'محوراً'},
      {k:'learned', l:'ما تعلمته', t:'list', one:'فكرة'},
      {k:'exercises', l:'التطبيقات', t:'list', one:'تطبيقاً'},
      {k:'apply', l:'ما سأطبقه عملياً', t:'list', one:'خطوة'} ]},
  diary:{ name:'يوميات', icon:'📔', color:'#D97706', desc:'ورقة حرة أو قائمة تحقق', noEntity:true,
    titlePh:'موضوع اليوم',
    fields:[ {k:'page', l:'يومياتي', t:'diary'} ]}
};
const STATUS = [ {k:'todo',n:'قيد الانتظار'}, {k:'doing',n:'جارٍ'}, {k:'done',n:'أُنجز'} ];
const stName = k => (STATUS.find(s=>s.k===k)||STATUS[0]).n;

/* =========================================================
   أدوات عامة
   ========================================================= */
const $  = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br = s => s.replace(/\n/g,'<br>');
const pad = n => String(n).padStart(2,'0');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function store(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ toast('تعذّر الحفظ على الجهاز: المساحة ممتلئة'); } }
function nowLocal(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const todayStr = () => nowLocal().slice(0,10);
function parseLocal(s){ if(!s) return null; const [d,t='00:00']=String(s).split('T'); const [y,m,dd]=d.split('-').map(Number); const [hh,mm]=t.split(':').map(Number); return new Date(y,(m||1)-1,dd||1,hh||0,mm||0); }
const daysBetween = (a,b) => Math.round((parseLocal(b.slice(0,10)) - parseLocal(a.slice(0,10))) / 864e5);
const LOC = 'ar-DZ-u-nu-latn';
function fmtLong(s){ const d=parseLocal(s); return d ? d.toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long',year:'numeric'}) : ''; }
function fmtDay(s){ const d=parseLocal(s); return d ? d.toLocaleDateString(LOC,{day:'numeric',month:'long'}) : ''; }
function fmtDue(s){ const d=parseLocal(s); return d ? d.toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'}) : '—'; }
function fmtShort(s){
  if(!s) return '';
  const diff = daysBetween(s, todayStr());
  if(diff===0) return 'اليوم ' + s.slice(11,16);
  if(diff===1) return 'أمس ' + s.slice(11,16);
  return fmtDay(s);
}
function leftText(n){
  if(n<0){ n=-n; return n===1?'متأخر بيوم':n===2?'متأخر بيومين':n<=10?`متأخر بـ${n} أيام`:`متأخر بـ${n} يوماً`; }
  if(n===0) return 'الأجل اليوم';
  return n===1?'بقي يوم واحد':n===2?'بقي يومان':n<=10?`بقيت ${n} أيام`:`بقي ${n} يوماً`;
}
const norm = s => String(s||'').trim().toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ');
function hexA(hex,a){ const h=(hex||'#888888').replace('#',''); return '#'+h.slice(0,6)+Math.round(a*255).toString(16).padStart(2,'0'); }
function onColor(hex){ const h=(hex||'#888888').replace('#',''); const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255); const L=0.2126*r+0.7152*g+0.0722*b; return L>0.62?'#1F2328':'#FFFFFF'; }
function avatarColor(name){ let h=0; for(const c of String(name)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 55% 48%)`; }
function grow(ta){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }
const go = h => { location.hash = h; };

/* =========================================================
   الحالة والتخزين المحلي
   ========================================================= */
let S = load(LS.state) || { reports:[], decisions:[], labels: DEFAULT_LABELS.map(x=>({...x})) };
if(!Array.isArray(S.labels) || !S.labels.length) S.labels = DEFAULT_LABELS.map(x=>({...x}));
let OUT = load(LS.outbox) || [];
let inflight = new Set();
const dirty = new Set();
let persistT;
function persist(){ clearTimeout(persistT); store(LS.state, S); }
function persistSoon(){ clearTimeout(persistT); persistT=setTimeout(()=>store(LS.state,S),300); }
const saveOut = () => store(LS.outbox, OUT);

const api   = () => localStorage.getItem(LS.api) || DEFAULT_API;
const token = () => localStorage.getItem(LS.token) || '';
const localMode = () => localStorage.getItem(LS.mode) === 'local';

const label = id => S.labels.find(l=>l.id===id);
const lc = id => (label(id)||{}).color || '#8A8F98';
const reportById = id => S.reports.find(r=>r.id===id);
const reportDecs = id => S.decisions.filter(d=>d.report_id===id).sort((a,b)=>a.id<b.id?-1:1);
const cleanReport = r => { const o={}; for(const k in r) if(k[0]!=='_') o[k]=r[k]; return o; };
const cleanDec = d => ({ id:d.id, report_id:d.report_id, text:d.text||'', owner:d.owner||'', due:d.due||'', status:d.status||'todo', done_at:d.done_at||'', created_at:d.created_at||'', updated_at:d.updated_at||'' });

function hasContent(r){
  if((r.title||'').trim() || (r.notes||'').trim() || (r.entity||'').trim()) return true;
  for(const k in (r.details||{})){ if(k==='mode') continue; const v=r.details[k]; if(Array.isArray(v) ? v.some(x=>itemText(x).trim()) : String(v||'').trim()) return true; }
  return reportDecs(r.id).length>0;
}

/* =========================================================
   طابور المزامنة (يعمل دون إنترنت)
   ========================================================= */
function enqueue(op){
  op.opId = uid('o');
  if(op.key) OUT = OUT.filter(o => !(o.key===op.key && !inflight.has(o.opId)));
  OUT.push(op); saveOut(); setInd(); scheduleSync();
}
function queueReport(r){
  r._sent = true;
  enqueue({ op:'saveReport', key:'r:'+r.id, report:cleanReport(r), decisions:reportDecs(r.id).map(cleanDec) });
}
function changed(r){ r.updated_at = nowLocal(); dirty.add(r.id); persistSoon(); setInd(); }
function flushDirty(){
  if(!dirty.size) return;
  [...dirty].forEach(id => { const r=reportById(id); if(r && hasContent(r)) queueReport(r); });
  dirty.clear(); persist(); setInd();
}
setInterval(flushDirty, 3000);   // حفظ كل 3 ثوانٍ

let syncing=false, lastErr='', pullAfter=false, syncT, lastPull=0;
function scheduleSync(ms=1500){ clearTimeout(syncT); syncT=setTimeout(()=>sync(),ms); }

async function call(action, payload={}){
  const res = await fetch(api(), { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action, token:token(), ...payload }) });
  const j = await res.json();
  if(j.error==='AUTH'){ localStorage.removeItem(LS.token); toast('انتهت الجلسة، أدخل الرمز من جديد'); setTimeout(route,0); throw new Error('AUTH'); }
  return j;
}

async function sync(opts={}){
  if(localMode() || !api() || !token()){ setInd(); return; }
  if(syncing){ pullAfter = pullAfter || !!opts.pull; return; }
  if(!navigator.onLine){ setInd(); return; }
  syncing=true; setInd();
  try{
    while(OUT.length){
      const batch = OUT.slice(0,25), ids = batch.map(o=>o.opId);
      inflight = new Set(ids);
      const res = await call('batch', { ops: batch.map(({opId,key,...rest})=>rest) });
      const doneIds = new Set(ids.slice(0, res.done||0));
      OUT = OUT.filter(o=>!doneIds.has(o.opId)); saveOut();
      inflight = new Set();
      if(!res.ok) throw new Error(res.error || 'خطأ في الخادم');
    }
    if(opts.pull || pullAfter){
      pullAfter=false;
      if(isEditorOpen()) pullAfter=true;
      else { const res = await call('getAll'); if(res.ok && !OUT.length && !dirty.size){ mergeServer(res.data); lastPull=Date.now(); } }
    }
    lastErr='';
  }catch(e){ lastErr = e.message || 'تعذّر الاتصال'; }
  finally{ syncing=false; inflight=new Set(); setInd(); if(OUT.length && !lastErr) scheduleSync(800); }
}

function mergeServer(data, first=false){
  const srv = new Map((data.reports||[]).map(r=>[r.id, {...r, details:r.details||{}, _sent:true}]));
  if(first){ // أول دخول: ما هو محلي فقط يُرسل للشيت
    S.reports.forEach(r=>{ if(!srv.has(r.id) && hasContent(r)) { srv.set(r.id, r); setTimeout(()=>queueReport(r),0); } });
  }
  const localDecs = S.decisions;
  S.reports = [...srv.values()];
  S.decisions = (data.decisions||[]).slice();
  if(first) localDecs.forEach(d=>{ if(!S.decisions.some(x=>x.id===d.id) && srv.has(d.report_id)) S.decisions.push(d); });
  if(Array.isArray(data.labels) && data.labels.length){ if(!OUT.some(o=>o.key==='labels')) S.labels = data.labels; }
  else enqueue({ op:'saveLabels', key:'labels', labels:S.labels });
  persist();
  if(!isEditorOpen()) route();
}

function knownPeople(){
  const m=new Map();
  const add=(n,e)=>{ n=String(n||'').trim(); if(!n) return; if(!m.has(n)) m.set(n,new Set()); if(e) m.get(n).add(norm(e)); };
  S.reports.forEach(r=>{ (r.details.attendees||[]).forEach(n=>add(n,r.entity)); (r.details.absent||[]).forEach(n=>add(n,r.entity)); });
  S.decisions.forEach(d=>{ const r=reportById(d.report_id); add(d.owner, r&&r.entity); });
  return m;
}
function membersOf(entity){ const e=norm(entity); if(!e) return []; return [...knownPeople()].filter(([,s])=>s.has(e)).map(([n])=>n); }
function entities(){ const m=new Map(); S.reports.forEach(r=>{ const e=(r.entity||'').trim(); if(e && !m.has(norm(e))) m.set(norm(e), e); }); return [...m.values()]; }
function datalists(){
  return `<datalist id="dl_people">${[...knownPeople().keys()].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
          <datalist id="dl_entities">${entities().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;
}
function dInfo(d){
  const r = reportById(d.report_id);
  const left = d.due ? daysBetween(todayStr(), d.due) : null;
  return { d, r, left, overdue: d.status!=='done' && left!==null && left<0, color: lc(r && r.label) };
}
const overdueCount = () => S.decisions.filter(d=>reportById(d.report_id) && d.status!=='done' && d.due && d.due<todayStr()).length;
function titleOf(r){ const T=TYPES[r.type]; return (r.title||'').trim() || `${T.name} ${fmtDay(r.date)}`; }
function snippet(r){
  for(const f of TYPES[r.type].fields){
    const v=r.details[f.k];
    if(f.t==='list' && Array.isArray(v)){ const a=v.filter(x=>String(x).trim()); if(a.length) return a.slice(0,3).join(' · '); }
    if((f.t==='textarea'||f.t==='text') && String(v||'').trim()) return String(v);
    if(f.t==='diary'){ const D=r.details;
      if(D.mode==='check'){ const it=(D.items||[]).filter(x=>x.t.trim()); if(it.length) return `☑️ ${it.filter(x=>x.done).length}/${it.length} · `+it.slice(0,3).map(x=>x.t).join(' · '); }
      else if(String(D.text||'').trim()) return D.text; }
  }
  return r.notes || '';
}
function searchText(r){
  const parts=[r.title,r.entity,r.place,r.notes];
  for(const k in r.details){ if(k==='mode') continue; const v=r.details[k]; parts.push(Array.isArray(v)?v.map(itemText).join(' '):v); }
  reportDecs(r.id).forEach(d=>parts.push(d.text,d.owner));
  return norm(parts.join(' '));
}
function setDecStatus(id, st){
  const d=S.decisions.find(x=>x.id===id); if(!d || d.status===st) return false;
  d.status=st; d.done_at = st==='done' ? nowLocal() : ''; d.updated_at=nowLocal();
  persist(); enqueue({ op:'saveDecision', key:'d:'+id, decision:cleanDec(d) });
  return true;
}
function saveDec(d){ d.updated_at=nowLocal(); persistSoon(); enqueue({ op:'saveDecision', key:'d:'+d.id, decision:cleanDec(d) }); }
function saveLabels(){ persist(); enqueue({ op:'saveLabels', key:'labels', labels:S.labels }); }

};
const TH = Object.assign({ mode:'auto', light:'lavender', dark:'indigo' }, load('tq_theme') || {});
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => TH.mode==='dark' || (TH.mode==='auto' && darkMQ.matches);
function applyTheme(){
  const id = isDark() ? TH.dark : TH.light;
  document.documentElement.dataset.bg = id;
  const t = [...THEMES.light, ...THEMES.dark].find(x=>x.id===id);
  const meta = document.querySelector('meta[name=theme-color]'); if(meta && t) meta.content = t.bg;
}
function setTheme(patch, ev){
  withReveal(ev, ()=>{ Object.assign(TH, patch); store('tq_theme', TH); applyTheme(); });
}
// تبديل الثيم بدائرة تتّسع من مكان اللمس
function withReveal(ev, fn){
  if(!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches){ fn(); return; }
  const x = ev && ev.clientX!=null ? ev.clientX : innerWidth/2, y = ev && ev.clientY!=null ? ev.clientY : 60;
  const r = Math.hypot(Math.max(x, innerWidth-x), Math.max(y, innerHeight-y));
  const t = document.startViewTransition(fn);
  t.ready.then(()=>document.documentElement.animate(
    { clipPath:[`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
    { duration:600, easing:'cubic-bezier(.4,0,.2,1)', pseudoElement:'::view-transition-new(root)' })).catch(()=>{});
}
darkMQ.addEventListener && darkMQ.addEventListener('change', ()=>{ if(TH.mode==='auto') applyTheme(); });

/* =========================================================
   النوافذ المنبثقة: تُغلق بالسحب للأسفل، أو بزر الرجوع في الهاتف
   ========================================================= */
const modalStack = [];
let ignorePop = 0, afterPop = null;
function modal(html){
  const o=document.createElement('div'); o.className='ov';
  o.innerHTML=`<div class="sheet"><div class="grab" aria-hidden="true"></div>${html}</div>`;
  document.body.appendChild(o);
  requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('show')));
  o.addEventListener('click', e=>{ if(e.target===o) closeModal(o); });
  modalStack.push(o);
  history.pushState({ modal:true }, '', location.href);
  bindSheetDrag(o);
  return o;
}
function closeModal(o, opts={}){
  if(!o || o._closing) return;
  o._closing = true;
  const i = modalStack.indexOf(o); if(i>-1) modalStack.splice(i,1);
  const sh = $('.sheet',o); sh.classList.remove('dragging'); sh.style.transform='';
  o.classList.remove('show');
  setTimeout(()=>o.remove(), 380);
  if(opts.fromPop){ opts.then && opts.then(); return; }
  // نرجع خطوة في السجل لإزالة خطوة النافذة، ثم ننفّذ ما بعدها
  let done=false; const run=()=>{ if(done) return; done=true; opts.then && opts.then(); };
  ignorePop++; afterPop = run; history.back();
  setTimeout(()=>{ if(!done){ if(ignorePop>0) ignorePop--; afterPop=null; run(); } }, 450);
}
window.addEventListener('popstate', ()=>{
  if(ignorePop>0){ ignorePop--; const f=afterPop; afterPop=null; f && f(); return; }
  if(modalStack.length) closeModal(modalStack[modalStack.length-1], { fromPop:true });
});
function bindSheetDrag(o){
  const sh=$('.sheet',o);
  let y0=0, dy=0, t0=0, active=false;
  const start=e=>{
    const fromGrab = e.target.closest('.grab');
    if(!fromGrab && sh.scrollTop>0) return;
    if(!fromGrab && e.target.closest('input,textarea,select,.pv')) return;
    y0=e.touches[0].clientY; dy=0; t0=Date.now(); active=true;
  };
  const move=e=>{
    if(!active) return;
    dy = e.touches[0].clientY - y0;
    if(dy<=0){ sh.style.transform=''; return; }
    if(dy>6){ sh.classList.add('dragging'); sh.style.transform=`translateY(${dy}px)`; o.style.background=`rgba(10,10,25,${Math.max(0,.45-dy/700)})`; if(e.cancelable) e.preventDefault(); }
  };
  const end=()=>{
    if(!active) return; active=false;
    const v = dy/Math.max(1,Date.now()-t0);
    sh.classList.remove('dragging'); o.style.background='';
    if(dy>110 || v>0.6) closeModal(o); else sh.style.transform='';
  };
  sh.addEventListener('touchstart',start,{passive:true});
  sh.addEventListener('touchmove',move,{passive:false});
  sh.addEventListener('touchend',end);
}

const app = $('#app');

const isEditorOpen = () => !!currentEditor && location.hash.startsWith('#/r/');
const depthOf = h => h.startsWith('#/r/') ? 2 : (h==='#/f'||h==='#/s') ? 1 : 0;

function route(){
  // مغادرة المحرر: حفظ فوري، وحذف التقرير الفارغ
  if(currentEditor && !location.hash.startsWith('#/r/'+currentEditor)){
    const r=reportById(currentEditor);

      S.reports=S.reports.filter(x=>x.id!==r.id); S.decisions=S.decisions.filter(d=>d.report_id!==r.id); persist();
      if(r._sent) enqueue({op:'deleteReport', key:'r:'+r.id, id:r.id});
    }
    currentEditor=null;
    if(pullAfter) sync({pull:true});
  }
  $$('.ov').forEach(o=>o.remove()); modalStack.length=0;
  window.scrollTo(0,0);
  const h = location.hash || '#/';
  const d = depthOf(h), dir = d>lastDepth ? 'fwd' : d<lastDepth ? 'back' : 'fade';
  lastDepth = d;
  app.style.transform=''; app.style.opacity='';
  app.classList.remove('fwd','back','fade'); void app.offsetWidth; app.classList.add(dir);
  if(!localMode() && (!api() || !token())) return viewLogin();
  if(h.startsWith('#/r/')) return viewEditor(h.slice(4));

}

/* سحب الصفحة أفقياً للرجوع (في المحرر والمتابعات والإعدادات) */
(function(){
  let x0=0,y0=0,dx=0,on=false,locked=false;
  const skip='select,input[type=date],input[type=datetime-local],.chips,.seg,.tabs,.pv,.dcard,.board,.ov,.nav';
  document.addEventListener('touchstart',e=>{
    on = depthOf(location.hash||'#/')>0 && !modalStack.length && !e.target.closest(skip);
    if(!on) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; locked=false;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!on) return;
    dx=e.touches[0].clientX-x0; const dy=e.touches[0].clientY-y0;
    if(!locked){ if(Math.abs(dy)>14 && Math.abs(dy)>Math.abs(dx)){ on=false; return; } if(Math.abs(dx)>18) locked=true; else return; }
    app.style.transition='none';
    app.style.transform=`translateX(${dx*0.45}px)`; app.style.opacity=String(1-Math.min(.5,Math.abs(dx)/600));
  },{passive:true});
  document.addEventListener('touchend',()=>{
    if(!on) return; on=false;
    app.style.transition='transform .3s var(--ease), opacity .3s';
    if(locked && Math.abs(dx)>95){
      app.style.transform=`translateX(${Math.sign(dx)*innerWidth*0.35}px)`; app.style.opacity='0';
      setTimeout(()=>{ app.style.transition=''; goBack(); }, 160);
    } else { app.style.transform=''; app.style.opacity=''; setTimeout(()=>app.style.transition='',300); }
  });
})();

  $('#typeTiles').innerHTML = Object.entries(TYPES).map(([k,t])=>
    `<button class="tile ${UI.type===k?'on':''}" data-t="${k}" style="--tc:${t.color}"><span class="sq">${t.icon}</span>${t.name}<small>${cnt(k)}</small></button>`).join('');
  $('#labelChips').innerHTML = S.labels.map(l=>`<button class="chip ${UI.label===l.id?'on':''}" data-l="${l.id}" style="--c:${l.color}"><span class="dot"></span>${esc(l.name)}</button>`).join('') +
    `<button class="chip ${UI.archived?'on':''}" data-arch style="--c:#5B5F7A">🗄️ الأرشيف</button>`;
  $$('#typeTiles [data-t]').forEach(b=>b.onclick=()=>{ UI.type = UI.type===b.dataset.t ? '' : b.dataset.t; renderHomeChips(); renderHomeList(); });
  $('#labelChips [data-arch]').onclick=()=>{ UI.archived=!UI.archived; renderHomeChips(); renderHomeList(); };
  $$('#labelChips [data-l]').forEach(b=>b.onclick=()=>{ UI.label = UI.label===b.dataset.l ? '' : b.dataset.l; renderHomeChips(); renderHomeList(); });
}
function renderHomeList(){
  const q=norm(UI.q);
  let rs = S.reports.filter(r => hasContent(r) || r.id===currentEditor)
    .filter(r => !!r.archived === UI.archived)
    .filter(r => !UI.type || r.type===UI.type)
    .filter(r => !UI.label || r.label===UI.label)
    .filter(r => !q || searchText(r).includes(q))
    .sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const box=$('#list');
  if(!rs.length){
    box.innerHTML = `<div class="empty"><div class="big">${UI.q||UI.type||UI.label||UI.archived?'🔍':'📝'}</div>
      <p>${UI.q||UI.type||UI.label||UI.archived?'لا توجد تقارير مطابقة':'لا توجد تقارير بعد'}</p>
      ${!UI.archived?'<button class="btn" onclick="openTypePicker()">+ أول تقرير</button>':''}</div>`;
    return;
  }
  let i=0; const card = r => cardHtml(r, i++);
  const pinned = rs.filter(r=>r.pinned), rest = rs.filter(r=>!r.pinned);
  let html = '';
  if(pinned.length) html += `<div class="grp">📌 المثبّتة</div><div class="cards">${pinned.map(card).join('')}</div>`;
  const months = new Map();
  rest.forEach(r=>{ const k=(r.date||'').slice(0,7); if(!months.has(k)) months.set(k,[]); months.get(k).push(r); });
  months.forEach((arr,k)=>{
    const d=parseLocal(k+'-01'); const name = d ? d.toLocaleDateString(LOC,{month:'long',year:'numeric'}) : '';
    html += `<div class="grp">${name} · ${arr.length}</div><div class="cards">${arr.map(card).join('')}</div>`;
  });
  box.innerHTML = html;
  $$('.card',box).forEach(c=>c.onclick=()=>go('#/r/'+c.dataset.id));
}
function cardHtml(r, i=0){
  const T=TYPES[r.type], L=label(r.label), c=lc(r.label);
  const decs=reportDecs(r.id), open=decs.filter(d=>d.status!=='done').length, late=decs.filter(d=>dInfo(d).overdue).length;
  const meta=[fmtShort(r.date), r.entity && (r.type==='meeting'?'مع '+r.entity:r.entity), r.place].filter(Boolean).map(esc).join(' · ');
  return `<article class="card" data-id="${r.id}" style="--lc:${c};--lcl:${hexA(c,.16)};--i:${i}">
    <div class="c-ic">${T.icon}</div>
    <div class="c-body">
      <div class="card-top"><span class="tp">${T.name}</span>${L?`<span class="lb">${esc(L.name)}</span>`:''}${r.pinned?'<span class="pin">📌</span>':''}</div>
      <h4>${esc(titleOf(r))}</h4>
      <div class="card-meta">${meta}</div>
      ${snippet(r)?`<p class="snip">${esc(snippet(r))}</p>`:''}
      ${decs.length?`<div class="card-foot"><span>⚖️ ${decs.length} قرار${open?` · ${open} مفتوح`:' · كلها منجزة ✓'}</span>${late?`<span class="red">⏰ ${late} متأخر</span>`:''}</div>`:''}
    </div>
  </article>`;
}
function openTypePicker(){
  const m = modal(`<h3>تقرير جديد</h3><div class="type-grid">${Object.entries(TYPES).map(([k,t])=>
    `<button data-t="${k}" style="--tc:${t.color}"><span>${t.icon}</span><b>${t.name}</b><small>${t.desc}</small></button>`).join('')}</div>`);
  $$('[data-t]',m).forEach(b=>b.onclick=()=>closeModal(m, { then:()=>newReport(b.dataset.t) }));
}
function newReport(type){
  const lastL = localStorage.getItem(LS.lastLabel) || '';
  const r = { id:uid('r'), type, title:'', label: label(lastL)?lastL:'', entity:'', place:'', date:nowLocal(),
    created_at:nowLocal(), updated_at:nowLocal(), pinned:false, archived:false, details:{}, notes:'' };
  S.reports.unshift(r); persist(); go('#/r/'+r.id);
}

function renderField(r,f){
  const box=$('#fb_'+f.k); if(!box) return;

  } else if(f.t==='textarea'){
    box.innerHTML=`<textarea class="in auto" rows="2" placeholder="اكتب هنا…">${esc(D[f.k]||'')}</textarea>`;

/* اليوميات: ورقة حرة مسطّرة أو قائمة تحقق */
const itemText = x => (x && typeof x==='object') ? (x.t||'') : String(x??'');
function renderDiary(r,f,box,focus){
  const D=r.details;
  // ترحيل اليوميات القديمة (الخانات السابقة) إلى ورقة حرة
  if(!D.mode){
    const parts=[]; [['done','ما أنجزت'],['learned','ما تعلمت'],['tomorrow','أولويات الغد']].forEach(([k,n])=>{ const a=(D[k]||[]).filter(x=>String(x).trim()); if(a.length) parts.push(n+':\n- '+a.join('\n- ')); });
    if(String(D.concerns||'').trim()) parts.push('ما يشغلني:\n'+D.concerns);
    if(parts.length){ D.mode='free'; D.text=parts.join('\n\n'); changed(r); }
  }
  if(!D.mode){
    box.innerHTML=`<p class="dm-q">كيف تريد أن تكتب يومك؟</p><div class="dmode-pick">
      <button data-m="free"><span class="dm-ic">📄</span><b>ورقة حرة</b><small>اكتب أفكارك بحرية كما في دفتر مسطّر</small></button>
      <button data-m="check"><span class="dm-ic">☑️</span><b>قائمة تحقق</b><small>بنود تؤشّر عليها كلما أنجزتها</small></button></div>`;
    $$('[data-m]',box).forEach(b=>b.onclick=()=>{ D.mode=b.dataset.m; changed(r); renderDiary(r,f,box, D.mode==='free'?'paper':'add'); });
    return;
  }
  box.innerHTML=`<div class="dmode-sw">
      <button data-m="free" class="${D.mode==='free'?'on':''}">📄 ورقة حرة</button>
      <button data-m="check" class="${D.mode==='check'?'on':''}">☑️ قائمة تحقق</button><i></i></div>
    <div class="dm-body"></div>`;
  box.querySelector('.dmode-sw').classList.toggle('right', D.mode==='free');
  $$('.dmode-sw [data-m]',box).forEach(b=>b.onclick=()=>{ if(D.mode===b.dataset.m) return; D.mode=b.dataset.m; changed(r); renderDiary(r,f,box); });
  const body=$('.dm-body',box);
  if(D.mode==='free'){
    body.innerHTML=`<div class="paper-w"><textarea class="ruled" placeholder="اكتب هنا ما في خاطرك…">${esc(D.text||'')}</textarea></div><div class="wc"></div>`;
    const ta=$('.ruled',body), wc=$('.wc',body);
    const count=()=>{ const n=(ta.value.trim().match(/\S+/g)||[]).length; wc.textContent = n ? `${n} كلمة` : ''; };
    ta.oninput=()=>{ D.text=ta.value; grow(ta); count(); changed(r); };
    grow(ta); count();
    if(focus==='paper') ta.focus();
    return;
  }
  // قائمة التحقق
  const items = Array.isArray(D.items) ? D.items : (D.items=[]);
  const done=items.filter(x=>x.done).length, pct=items.length?Math.round(done*100/items.length):0;
  body.innerHTML=`${items.length?`<div class="chk-prog"><div class="cp-bar"><i style="width:${pct}%"></i></div><span>أُنجز ${done} من ${items.length}${pct===100?' 🎉':''}</span></div>`:''}
    <ol class="lst chk">${items.map((it,i)=>`<li data-i="${i}" class="${it.done?'done':''}"><span class="hdl" data-h="${i}" aria-label="اسحب لإعادة الترتيب">⋮⋮</span>
      <button class="cb" data-cb="${i}" aria-label="تم"></button><textarea class="li-in" rows="1" data-i="${i}">${esc(it.t)}</textarea><button class="x" data-del="${i}" tabindex="-1" aria-label="حذف">×</button></li>`).join('')}</ol>
    <div class="add-row"><button class="plus" data-plus aria-label="إضافة">+</button><textarea class="add-in" rows="1" placeholder="أضف مهمة… (Enter للإضافة)"></textarea></div>`;
  const rerender=fo=>renderDiary(r,f,box,fo);
  $$('.li-in',body).forEach(ta=>{
    grow(ta); const i=+ta.dataset.i;
    ta.oninput=()=>{
      if(ta.value.includes('\n')){ const parts=ta.value.split('\n'); items.splice(i,1,{t:parts[0],done:items[i].done},...parts.slice(1).map(t=>({t,done:false}))); changed(r); return rerender(i+parts.length-1); }
      items[i].t=ta.value; grow(ta); changed(r);
    };
    ta.onkeydown=e=>{
      if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); items.splice(i+1,0,{t:'',done:false}); changed(r); rerender(i+1); }
      else if(e.key==='Backspace' && ta.value===''){ e.preventDefault(); items.splice(i,1); changed(r); rerender(i>0?i-1:'add'); }
    };
  });
  $$('[data-cb]',body).forEach(b=>b.onclick=()=>{
    const i=+b.dataset.cb; items[i].done=!items[i].done; changed(r);
    const li=b.closest('li'); li.classList.toggle('done',items[i].done); li.classList.remove('ticked'); void li.offsetWidth; if(items[i].done) li.classList.add('ticked');
    if(navigator.vibrate && items[i].done) navigator.vibrate(10);
    const d=items.filter(x=>x.done).length, p=Math.round(d*100/items.length), bar=$('.cp-bar i',body), lab=$('.chk-prog span',body);
    if(bar) bar.style.width=p+'%'; if(lab) lab.textContent=`أُنجز ${d} من ${items.length}${p===100?' 🎉':''}`;
    if(p===100) toast('أحسنت! أنجزت كل المهام 🎉');
  });
  $$('[data-del]',body).forEach(b=>b.onclick=()=>{ items.splice(+b.dataset.del,1); changed(r); rerender(); });
  $$('.hdl',body).forEach(h=>bindReorder(h, body, items, (from,to)=>{ const [it]=items.splice(from,1); items.splice(to,0,it); changed(r); rerender(); const li=$$('.lst li',body)[to]; li && li.classList.add('dropped'); }));
  const add=$('.add-in',body); let bound=-1;
  const commit=keep=>{ const lines=add.value.split('\n').map(s=>s.trim()).filter(Boolean); add.value='';
    if(bound>=0){ items.splice(bound,1,...lines.map(t=>({t,done:false}))); bound=-1; } else { if(!lines.length) return; items.push(...lines.map(t=>({t,done:false}))); }
    changed(r); rerender(keep?'add':undefined); };
  add.onkeydown=e=>{ if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); commit(true); } };
  add.oninput=()=>{ if(add.value.includes('\n')) return commit(true); grow(add);
    if(bound>=0){ if(add.value.trim()) items[bound].t=add.value.trim(); else { items.splice(bound,1); bound=-1; } changed(r); } };
  add.onblur=()=>{ const v=add.value.trim(); if(v && bound<0){ items.push({t:v,done:false}); bound=items.length-1; changed(r); } };
  $('[data-plus]',body).onclick=()=>{ if(add.value.trim()) commit(true); else add.focus(); };
  if(focus==='add'){ add.focus(); const li=$$('.lst li',body); li.length && li[li.length-1].classList.add('new'); }
  else if(typeof focus==='number'){ const t=$(`.li-in[data-i="${focus}"]`,body); if(t){ t.closest('li').classList.add('new'); t.focus(); } }
}

/* قائمة بنود: Enter = بند جديد، مسح بند فارغ = حذفه */
function renderList(r,f,box,focus){
  const arr = Array.isArray(r.details[f.k]) ? r.details[f.k] : (r.details[f.k]=[]);
  box.innerHTML = `<ol class="lst">${arr.map((v,i)=>`<li data-i="${i}"><span class="hdl" data-h="${i}" aria-label="اسحب لإعادة الترتيب">⋮⋮</span><textarea class="li-in" rows="1" data-i="${i}">${esc(v)}</textarea><button class="x" data-del="${i}" tabindex="-1" aria-label="حذف">×</button></li>`).join('')}</ol>
    <div class="add-row"><button class="plus" data-plus aria-label="إضافة">+</button><textarea class="add-in" rows="1" placeholder="أضف ${f.one||'بنداً'}… (Enter للإضافة)"></textarea></div>`;
  const rerender = fo => renderList(r,f,box,fo);
  $$('.li-in',box).forEach(ta=>{
    grow(ta);
    const i=+ta.dataset.i;
    ta.oninput=()=>{
      if(ta.value.includes('\n')){ const parts=ta.value.split('\n'); arr.splice(i,1,...parts); changed(r); return rerender(i+parts.length-1); }
      arr[i]=ta.value; grow(ta); changed(r);
    };
    ta.onkeydown=e=>{
      if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); arr.splice(i+1,0,''); changed(r); rerender(i+1); }
      else if(e.key==='Backspace' && ta.value===''){ e.preventDefault(); arr.splice(i,1); changed(r); rerender(i>0?i-1:'add'); }
    };
  });
  $$('[data-del]',box).forEach(b=>b.onclick=()=>{ arr.splice(+b.dataset.del,1); changed(r); rerender(); });
  $$('.hdl',box).forEach(h=>bindReorder(h, box, arr, (from,to)=>{ const [it]=arr.splice(from,1); arr.splice(to,0,it); changed(r); rerender(); const li=$$('.lst li',box)[to]; li && li.classList.add('dropped'); }));
  const add=$('.add-in',box);
  // عند مغادرة الخانة يُحفظ النص فوراً دون إعادة رسم (حتى لا تتحرك الصفحة تحت إصبعك)
  let bound=-1;
  const commit = (keepFocus) => {
    const lines = add.value.split('\n').map(s=>s.trim()).filter(Boolean);
    add.value='';
    if(bound>=0){ arr.splice(bound,1,...lines); bound=-1; }
    else { if(!lines.length) return; arr.push(...lines); }
    changed(r); rerender(keepFocus?'add':undefined);
  };
  add.onkeydown=e=>{ if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); commit(true); } };
  add.oninput=()=>{
    if(add.value.includes('\n')) return commit(true);
    grow(add);
    if(bound>=0){ if(add.value.trim()) arr[bound]=add.value.trim(); else { arr.splice(bound,1); bound=-1; } changed(r); }
  };
  add.onblur=()=>{ const v=add.value.trim(); if(v && bound<0){ arr.push(v); bound=arr.length-1; changed(r); } };
  $('[data-plus]',box).onclick=()=>{ if(add.value.trim()) commit(true); else add.focus(); };
  if(focus==='add'){ add.focus(); const li=$$('.lst li',box); li.length && li[li.length-1].classList.add('new'); }
  else if(typeof focus==='number'){ const t=$(`.li-in[data-i="${focus}"]`,box); if(t){ t.closest('li').classList.add('new'); t.focus(); t.setSelectionRange(t.value.length,t.value.length); } }
}

/* إعادة الترتيب: امسك المقبض ⋮⋮ واسحب البند للأعلى أو للأسفل */
function bindReorder(handle, box, arr, done){
  handle.addEventListener('pointerdown', e=>{
    if(arr.length<2) return;
    e.preventDefault();
    const lis=$$('.lst li',box), li=handle.closest('li'), from=+li.dataset.i;
    const rects=lis.map(x=>x.getBoundingClientRect()), h=rects[from].height+0;
    const y0=e.clientY; let to=from;
    handle.setPointerCapture(e.pointerId);
    li.classList.add('dragging'); box.classList.add('sorting');
    if(navigator.vibrate) navigator.vibrate(12);
    const move=ev=>{
      const dy=ev.clientY-y0; li.style.transform=`translateY(${dy}px) scale(1.02)`;
      const mid=rects[from].top+rects[from].height/2+dy;
      to=from;
      rects.forEach((rc,i)=>{ if(i<from && mid<rc.top+rc.height/2) to=Math.min(to,i); if(i>from && mid>rc.top+rc.height/2) to=Math.max(to,i); });
      lis.forEach((x,i)=>{ if(i===from) return;
        const shift = (from<to && i>from && i<=to) ? -h : (from>to && i<to+ (from-to) +1 && i>=to && i<from) ? h : 0;
        x.style.transform = shift?`translateY(${shift}px)`:''; });
      if(ev.clientY<80) scrollBy(0,-8); else if(ev.clientY>innerHeight-120) scrollBy(0,8);
    };
    const up=()=>{
      handle.removeEventListener('pointermove',move); handle.removeEventListener('pointerup',up); handle.removeEventListener('pointercancel',up);
      box.classList.remove('sorting'); lis.forEach(x=>{ x.style.transform=''; x.classList.remove('dragging'); });
      if(to!==from) done(from,to);
    };
    handle.addEventListener('pointermove',move); handle.addEventListener('pointerup',up); handle.addEventListener('pointercancel',up);
  });
}

/* الأشخاص: تُضاف الشريحة دون إعادة رسم الخانة، فيبقى المؤشر فيها لتكمل كتابة الأسماء */
function renderPeople(r,f,box){
  const arr = Array.isArray(r.details[f.k]) ? r.details[f.k] : (r.details[f.k]=[]);
  box.innerHTML = `<div class="chips-in"><input class="p-in" list="dl_people" enterkeyhint="enter" autocomplete="off" autocapitalize="words"></div><div class="p-more"></div>`;
  const wrap=$('.chips-in',box), inp=$('.p-in',box), more=$('.p-more',box);
  const chip=(n,anim)=>{
    const s=document.createElement('span'); s.className='pchip'+(anim?' pop':'');
    s.innerHTML=`${esc(n)}<button type="button" aria-label="حذف">×</button>`;
    s.querySelector('button').onclick=e=>{ e.preventDefault(); const i=arr.indexOf(n); if(i>-1) arr.splice(i,1); changed(r);
      s.classList.add('out'); setTimeout(()=>{ s.remove(); refreshAllMore(r); },180); };
    wrap.insertBefore(s, inp);
  };
  const refreshMore=()=>{
    const taken = new Set([...(r.details.attendees||[]), ...(r.details.absent||[])]);
    const members = membersOf(r.entity).filter(n=>!taken.has(n));
    inp.placeholder = arr.length ? 'اسم آخر…' : 'اكتب اسماً ثم Enter';
    more.innerHTML = members.length ? `<button type="button" class="ghost sm">+ أعضاء «${esc(r.entity)}» المعروفون (${members.length})</button>` : '';
    if(members.length) more.firstChild.onclick=()=>{ members.forEach(n=>{ arr.push(n); chip(n,true); }); changed(r); refreshAllMore(r); toast(`أُضيف ${members.length} اسماً`); };
  };
  box._refresh = refreshMore;
  const add=raw=>{
    const v=String(raw||'').replace(/[،,\n]/g,' ').replace(/\s+/g,' ').trim();
    inp.value='';
    if(!v || arr.includes(v)) return;
    arr.push(v); chip(v,true); changed(r); refreshAllMore(r); refreshDatalists();
  };
  arr.forEach(n=>chip(n,false)); refreshMore();
  inp.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===','||e.key==='،') && !e.isComposing){ e.preventDefault(); add(inp.value); }
    else if(e.key==='Backspace' && !inp.value && arr.length){
      const last=arr.pop(); changed(r); const chips=$$('.pchip',wrap); const c=chips[chips.length-1]; if(c){ c.classList.add('out'); setTimeout(()=>c.remove(),180); }
      inp.value=last; refreshAllMore(r);
    }
  });
  inp.addEventListener('input',e=>{
    if(/[،,\n]/.test(inp.value)) return add(inp.value);
    if(e.inputType==='insertReplacementText' || !e.inputType) add(inp.value);   // اختيار اسم من الاقتراحات
  });
  inp.addEventListener('blur',()=>{ const v=inp.value; if(v.trim()) setTimeout(()=>{ if(document.activeElement!==inp) add(v); },250); });
  wrap.addEventListener('click',e=>{ if(e.target===wrap) inp.focus(); });
}
function refreshAllMore(r){ TYPES[r.type].fields.filter(f=>f.t==='people').forEach(f=>{ const b=$('#fb_'+f.k); b && b._refresh && b._refresh(); }); }
function renderPeopleAll(r){ refreshAllMore(r); refreshDatalists(); }
function refreshDatalists(){ const d=document.createElement('div'); d.innerHTML=datalists(); ['dl_people','dl_entities'].forEach(id=>{ const old=$('#'+id); if(old) old.replaceWith(d.querySelector('#'+id)); }); }

/* القرارات داخل الجلسة */
function renderDecs(r,f,box,focusLast){
  const decs=reportDecs(r.id);
  box.innerHTML = decs.map((d,i)=>`<div class="dec" data-id="${d.id}">
      <div class="dec-n">${i+1}</div>
      <div class="dec-main">
        <textarea class="in auto d-text" rows="1" placeholder="نص القرار…">${esc(d.text)}</textarea>
        <div class="dec-row">
          <label title="المسؤول">👤<input class="d-owner" list="dl_people" placeholder="المسؤول" value="${esc(d.owner)}" autocomplete="off"></label>
          <label title="الأجل">⏰<input type="date" class="d-due" value="${esc(d.due)}"></label>
          <select class="d-st">${STATUS.map(s=>`<option value="${s.k}" ${d.status===s.k?'selected':''}>${s.n}</option>`).join('')}</select>
          <button class="x" data-del aria-label="حذف القرار">×</button>
        </div>
      </div></div>`).join('') + `<button class="ghost" data-add>+ إضافة قرار</button>`;
  $$('.dec',box).forEach(el=>{
    const d=S.decisions.find(x=>x.id===el.dataset.id);
    const t=$('.d-text',el); grow(t);
    t.oninput=()=>{ d.text=t.value; d.updated_at=nowLocal(); grow(t); changed(r); };
    $('.d-owner',el).oninput=e=>{ d.owner=e.target.value; d.updated_at=nowLocal(); changed(r); };
    $('.d-due',el).onchange=e=>{ d.due=e.target.value; d.updated_at=nowLocal(); changed(r); };
    $('.d-st',el).onchange=e=>{ d.status=e.target.value; d.done_at=d.status==='done'?nowLocal():''; d.updated_at=nowLocal(); changed(r); };
    $('[data-del]',el).onclick=()=>{ if(d.text.trim() && !confirm('حذف هذا القرار؟')) return; S.decisions=S.decisions.filter(x=>x.id!==d.id); changed(r); renderDecs(r,f,box); };
  });
  $('[data-add]',box).onclick=()=>{
    S.decisions.push({ id:uid('d'), report_id:r.id, text:'', owner:'', due:'', status:'todo', done_at:'', created_at:nowLocal(), updated_at:nowLocal() });
    changed(r); renderDecs(r,f,box,true);
  };
  if(focusLast){ const all=$$('.d-text',box); all.length && all[all.length-1].focus(); }
}

/* تنبيه: قرارات سابقة غير منجزة مع نفس الجهة */

function editorMenu(r){
  const m=modal(`<h3>${esc(titleOf(r))}</h3><div class="menu-list">
    <button data-a="arch">${r.archived?'📂 إخراج من الأرشيف':'🗄️ أرشفة'}</button>

  $('[data-a=arch]',m).onclick=()=>{ r.archived=!r.archived; changed(r); flushDirty(); toast(r.archived?'أُرشف التقرير':'أُخرج من الأرشيف'); closeModal(m, { then:()=>{ if(r.archived) go('#/'); } }); };
  $('[data-a=print]',m).onclick=()=>{ flushDirty(); closeModal(m, { then:()=>printPages(reportPages(r)) }); };

    dirty.delete(r.id); persist(); enqueue({op:'deleteReport', key:'r:'+r.id, id:r.id});
